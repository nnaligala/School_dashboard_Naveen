# Save as /etc/nginx/sites-available/naveens-school.conf and symlink into sites-enabled.
# The two limit_req_zone lines must live in the http{} context (e.g. /etc/nginx/conf.d/rate.conf).
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

upstream django_app {
    least_conn;
    server APP1_PRIVATE_IP:8000 max_fails=3 fail_timeout=15s;
    server APP2_PRIVATE_IP:8000 max_fails=3 fail_timeout=15s;
    keepalive 16;
}

server {
    listen 80;
    server_name school.example.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name school.example.com;

    ssl_certificate     /etc/letsencrypt/live/school.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/school.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 6m;
    server_tokens off;

    access_log /var/log/nginx/naveens.access.log;
    error_log  /var/log/nginx/naveens.error.log;

    location /static/ { alias /var/www/naveens/staticfiles/; expires 7d; }
    location /media/  { alias /var/www/naveens/media/; }   # shared mount in multi-server setups
    location = /metrics { return 404; }

    location = /accounts/login/ {
        limit_req zone=login burst=5 nodelay;
        include /etc/nginx/snippets/naveens-proxy.conf;
    }

    location / {
        limit_req zone=general burst=20 nodelay;
        include /etc/nginx/snippets/naveens-proxy.conf;
    }
}
