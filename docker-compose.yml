name: naveens-school

x-app: &app
  build: .
  env_file: .env
  volumes:
    - .:/app
    - static_data:/app/staticfiles
    - media_data:/app/media
  networks: [backend]
  depends_on:
    db: {condition: service_healthy}
    rabbitmq: {condition: service_healthy}
    memcached: {condition: service_started}

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes: [pg_data:/var/lib/postgresql/data]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
    ports: ["15672:15672"]
    volumes: [rabbit_data:/var/lib/rabbitmq]
    networks: [backend]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  memcached:
    image: memcached:1.6-alpine
    command: ["memcached", "-m", "128"]
    networks: [backend]

  mailpit:
    image: axllent/mailpit
    ports: ["8025:8025"]
    networks: [backend]

  web:
    <<: *app
    environment: {RUN_MIGRATIONS: "1"}
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --reload --access-logfile -
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz/"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    <<: *app
    command: celery -A config worker -l info -Q default,email,sms,reports,imports --concurrency 2

  beat:
    <<: *app
    command: celery -A config beat -l info --schedule /tmp/celerybeat-schedule

  nginx:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes:
      - ./deploy/docker/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/app/staticfiles:ro
      - media_data:/app/media:ro
    networks: [backend]
    depends_on: {web: {condition: service_healthy}}

networks:
  backend:

volumes:
  pg_data:
  rabbit_data:
  static_data:
  media_data:
